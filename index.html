<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>conversor_de_moeda</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="Style.css">
    <link rel="icon" type="image/png" href="imagens/troca.png"> 
</head>

<body>
<img class="logo" src="./imagens/troca.png" alt="logo">
    <main>
        <label>
            Converter <b>de</b>
            <select>
                <option>AOA Kwanzas</option>
                <!-- <option>USDT</option>
                <option>RUB Rubros</option>
                <option>USD Dólar americano</option>
                <option>EUR Euro</option> -->
            </select>

        </label>
        <label>
            Converter <b>para</b>
            <select class="currency-select">
                <option value="USDT" >USDT</option>
                <option value="BRL" >BRL Reias</option>
                <option value="CDF" >CDF Franco Congoles</option>
                <option value="Dolar" >USD Dólar americano</option>
                <option value="Euro" >EUR Euro</option>
                <option value="Rubre" >RUB Rubre</option>
            </select>

        </label>

        <label>
            Valor:
            <input class="input-value" type="text" placeholder="1.000.000,00 AOA">
        </label>

        <button class="convert-btn" >Converter</button>

        <section>
            <div class="from-converter">
                <img id="currency-img1" src="./imagens/angola.png" alt="logo_AOA">
                <p>Kwanzas</p>
                <p class="currency-value-to-convert">0,0 AOA</p>

            </div>
            <div class="arrow">
                <img src="./imagens/seta.png" alt="seta">
            </div>
            <div class="to-converter">
                <img id="currency-img" src="./imagens/usdt.png" alt="logo_USDT">
                <p id="currency-name">USDT</p>
                <p class="currency-value">0,0 USDT</p>
            </div>

        </section>

    </main>

</body>
<script src="./aulo.js"></script>

</html>
