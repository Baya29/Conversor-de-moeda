<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>conversor_de_moeda</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="Style.css">
</head>

<body>
<img class="logo" src="./imagens/troca.png" alt="logo">
    <main>
        <label>
            Converter <b>de</b>
            <select>
                <option>AOA Kwanzas</option>
                <option>USDT</option>
                <option>RUB Rubros</option>
                <option>USD Dólar americano</option>
                <option>EUR Euro</option>
            </select>

        </label>
        <label>
            Converter <b>para</b>
            <select>
                <option>USDT</option>
                <option>AOA Kwanzas</option>
                <option>RUB Rubros</option>
                <option>USD Dólar americano</option>
                <option>EUR Euro</option>
            </select>

        </label>

        <label>
            Valor:
            <input type="text" placeholder="Digite o valor a ser convertido">
        </label>

        <button>Converter</button>

        <section>
            <div class="from-converter">
                <img src="./imagens/angola.png" alt="logo_AOA">
                <p>Kwanzas</p>
                <p>0,0 AOA</p>

            </div>
            <div class="arrow">
                <img src="./imagens/seta.png" alt="seta">
            </div>
            <div class="to-converter">
                <img src="./imagens/usdt.png" alt="logo_USDT">
                <p>USDT</p>
                <p>0,0 USDT</p>
            </div>

        </section>

    </main>

</body>
<script src="./aulo.js"></script>

</html>
